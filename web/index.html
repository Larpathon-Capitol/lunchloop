<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#FB6F92" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LunchLoop predicts how much food a school cafeteria should cook, and lets students vote on what comes next." />
    <title>LunchLoop</title>
    <script>
      // Paint the saved world from the first frame, so there is no flash of the default one.
      try {
        var t = localStorage.getItem('lunchloop.theme')
        document.documentElement.dataset.theme = t === 'asia' || t === 'medi' || t === 'americas' ? t : 'americas'
      } catch (e) {
        document.documentElement.dataset.theme = 'americas'
      }
      // Staff pages start calm too. The Shell sets the real mode once React is up.
      if (/\/(school|kitchen|hub|behind-the-scenes|live\/admin)(\/|$)/.test(location.pathname)) {
        document.documentElement.dataset.mode = 'staff'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Gabarito:wght@400..800&family=Londrina+Solid:wght@400;900&family=Rakkas&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
