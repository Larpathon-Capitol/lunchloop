name: Commit check

# Runs main's copy of this workflow and script, so a pull request can't change
# the check it is being checked by. It only reads the pull request's commits; it
# never checks out or runs code from the pull request.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  commit-check:
    name: commit-check
    runs-on: ubuntu-latest
    environment: commit-check
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the pull request's commits
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          sh ./.github/scripts/check-commits.sh origin/main "$PR_HEAD_SHA"
