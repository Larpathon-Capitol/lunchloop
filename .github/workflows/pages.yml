name: Pages

# Publishes the frontend to GitHub Pages from main.
# Set the repository variable LUNCHLOOP_API_URL to the deployed backend's address.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the backend address is set
        env:
          API_URL: ${{ vars.LUNCHLOOP_API_URL }}
        run: |
          case "$API_URL" in
            https://*) echo "Backend: $API_URL" ;;
            *) echo "Set the repository variable LUNCHLOOP_API_URL to the backend's https address first."; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.LUNCHLOOP_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
